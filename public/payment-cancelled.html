<!DOCTYPE html>
<html>

<head>
    <title>Payment Cancelled - Hidden Pantry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDF7F2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #462F4D;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px 24px;
        }

        .logo {
            margin-bottom: 36px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: #462F4D;
            letter-spacing: -0.5px;
        }

        .logo-dot {
            color: #EF8A54;
        }

        .card {
            background: white;
            padding: 44px 36px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(70, 47, 77, 0.06);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #FFEBEE;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon-circle svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            color: #462F4D;
            margin-bottom: 12px;
            font-size: 22px;
            font-weight: 800;
        }

        p {
            color: #7a6b80;
            line-height: 1.7;
            font-size: 14px;
            font-weight: 500;
        }

        .footer {
            padding: 24px;
            text-align: center;
            color: #b8a8be;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.8;
        }

        .footer span {
            opacity: 0.7;
        }

        .powered {
            font-weight: 600;
            color: #9a8a9e;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <span class="logo-text">Hidden Pantry<span class="logo-dot">.</span></span>
        </div>

        <div class="card">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="#F44336" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
            <h1>Payment Cancelled</h1>
            <p>Your payment session was cancelled. No charges were made.</p>
            <br>
            <p>Please return to the app if you wish to try again.</p>
        </div>
    </div>

    <div class="footer">
        <span class="powered">Powered by Hidden Pantry</span><br>
        <span>Terms apply · © 2026 Hidden Pantry. All rights reserved.</span>
    </div>
</body>

</html>
