<!DOCTYPE html>
<html>

<head>
    <title>Onboarding Retry - Hidden Pantry</title>
    <style>
        body {
            font-family: 'Satoshi', sans-serif;
            background-color: #FDF7F2;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #462F4D;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(70, 47, 77, 0.05);
            text-align: center;
            max-width: 400px;
        }

        .icon {
            font-size: 48px;
            color: #FF8D4D;
            margin-bottom: 20px;
        }

        h1 {
            color: #462F4D;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Onboarding Incomplete</h1>
        <p>It looks like the Stripe onboarding process wasn't finished. You need to complete this to receive payments.
        </p>
        <p>Please return to the app and try again.</p>
    </div>
</body>

</html>
